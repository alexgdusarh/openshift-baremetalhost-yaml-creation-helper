[defaults]
# No default `inventory =` here on purpose: every cluster has its own
# inventory under clusters/<cluster-name>/inventory/hosts.yaml, and both
# playbooks require -i to be passed explicitly (the run-cluster.sh
# wrapper does this for you). A silent default here could point a
# forgotten -i at the wrong cluster.
library = library
host_key_checking = False
retry_files_enabled = False
