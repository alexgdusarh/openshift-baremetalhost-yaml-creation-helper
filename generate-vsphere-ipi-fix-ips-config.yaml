---
# generate-vsphere-ipi-fix-ips-config.yaml
#
# Renders an install-config.yaml for a vSphere IPI install with fixed
# (static) node IPs - the platform.vsphere.hosts network definitions a plain
# vSphere IPI install doesn't have - from the same cluster data as generate-agent-config.yaml:
# masters/workers groups and each host's `ip` in inventory/hosts.yaml, and
# cluster_name, base_domain, gateway, dns, network_profile.prefix_length,
# machine_network_cidr, api_vips, ingress_vips, pull_secret and ssh_key in
# vars/cluster.yaml. The vSphere-only settings (1 to n vCenters, 1 to n
# failure domains each on one of them, bootstrap IP, VM sizes) come from the
# `vsphere:` block of vars/cluster.yaml - see README.md's "vSphere IPI with
# fixed IPs" section. No hardware discovery
# is needed: these are VMs.
#
#   ./run-cluster.sh <cluster-name> vsphere-ipi-fix-ips
#
# Output: <cluster_dir>/output/vsphere-ipi-fix-ips/install-config.yaml, in its own
# directory because openshift-install consumes (and deletes) the
# install-config.yaml of the directory it runs in.
#
# platform.vsphere.hosts lists the bootstrap, then the masters and the
# workers in inventory order. With more than one failure domain each entry
# gets one: the host's vsphere_failure_domain inventory var, else round-robin
# over its machine pool's zones (vsphere.control_plane.zones /
# vsphere.compute.zones, default every failure domain); the bootstrap:
# bootstrap_failure_domain, else the first control-plane zone. It has no hostname field: node names are the VM names the
# installer generates.

- name: Validate inputs before loading any cluster-specific vars files
  hosts: localhost
  gather_facts: false
  connection: local
  tasks:
    - name: cluster_dir is required
      assert:
        that:
          - cluster_dir is defined
          - cluster_dir | length > 0
        fail_msg: >-
          cluster_dir is required, e.g. -e cluster_dir=clusters/ocp-lab -
          or use ./run-cluster.sh ocp-lab vsphere-ipi-fix-ips instead.

- name: Render a vSphere IPI install-config.yaml with static IPs
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - "{{ cluster_dir }}/vars/cluster.yaml"
  vars:
    output_dir: "{{ cluster_dir }}/output/vsphere-ipi-fix-ips"
    masters: "{{ groups.get('masters', []) }}"
    workers: "{{ groups.get('workers', []) }}"
    vcenter_keys: [server, username, password]
    failure_domain_keys: [name, region, zone, server, datacenter, compute_cluster, datastore, networks]
    # Each failure domain names its vCenter (`server`); with a single vCenter
    # it may leave it out.
    failure_domains: "{{ vsphere.failure_domains | default([]) | vsphere_failure_domain_servers(vsphere.vcenters | default([])) }}"
    vcenter_servers: "{{ vsphere.vcenters | default([]) | map(attribute='server') | list }}"
    fd_names: "{{ failure_domains | map(attribute='name') | list }}"
    # A machine pool may be limited to some failure domains (zones:)
    control_plane_pool: "{{ vsphere.control_plane | default({}) }}"
    compute_pool: "{{ vsphere.compute | default({}) }}"
    control_plane_zones: "{{ control_plane_pool.zones | default(fd_names) }}"
    compute_zones: "{{ compute_pool.zones | default(fd_names) }}"

  tasks:
    - name: vars/cluster.yaml has everything the vSphere install-config needs
      assert:
        that:
          - base_domain is defined and base_domain | length > 0
          - machine_network_cidr is defined and machine_network_cidr | length > 0
          - api_vips is defined and api_vips | length in [1, 2]
          - ingress_vips is defined and ingress_vips | length in [1, 2]
          - gateway is defined and dns.server | default([]) | length > 0
          - network_profile.prefix_length is defined
          - pull_secret is defined and ssh_key is defined
          - vsphere is defined
          - vsphere.vcenters | default([]) | length > 0
          - vsphere.bootstrap_ip is defined
          - vsphere.failure_domains | default([]) | length > 0
          - masters | length > 0
        fail_msg: >-
          {{ cluster_dir }}/vars/cluster.yaml needs base_domain, machine_network_cidr,
          api_vips, ingress_vips, gateway, dns.server, network_profile.prefix_length,
          pull_secret, ssh_key and a vsphere: block (a vcenters list of 1 to n,
          bootstrap_ip and a failure_domains list of 1 to n), and the inventory
          needs a masters group - see README.md's "vSphere IPI with fixed IPs".

    - name: Every failure domain is complete, uniquely named and on a listed vCenter
      assert:
        that:
          - failure_domain_keys | reject('in', item) | list | length == 0
          - failure_domains | selectattr('name', 'equalto', item.name) | list | length == 1
          - item.server in vcenter_servers
        fail_msg: >-
          vsphere.failure_domains entry {{ item.name | default(item) }} needs a unique name,
          {{ failure_domain_keys | join(', ') }} (missing: {{ failure_domain_keys | reject('in', item) | list }};
          server may be left out only with a single vCenter), and its server must be one of
          the vsphere.vcenters: {{ vcenter_servers }}.
      loop: "{{ failure_domains }}"
      loop_control:
        label: "{{ item.name | default('?') }}"

    - name: Every vCenter has a unique server, a username and a password, and hosts a failure domain
      assert:
        that:
          - vcenter_keys | reject('in', item) | list | length == 0
          - vcenter_servers | select('equalto', item.server) | list | length == 1
          - failure_domains | selectattr('server', 'defined') | selectattr('server', 'equalto', item.server) | list | length > 0
        fail_msg: >-
          vsphere.vcenters entry {{ item.server | default(item) }} needs a unique server,
          username and password (missing: {{ vcenter_keys | reject('in', item) | list }}) and at
          least one failure domain on it (the installer needs its datacenters).
      loop: "{{ vsphere.vcenters }}"
      loop_control:
        label: "{{ item.server | default('?') }}"

    - name: Machine pool zones are failure domains
      assert:
        that:
          - control_plane_zones | length > 0 and compute_zones | length > 0
          - (control_plane_zones + compute_zones) | reject('in', fd_names) | list | length == 0
        fail_msg: >-
          vsphere.control_plane.zones / vsphere.compute.zones must list failure domain
          names; unknown: {{ (control_plane_zones + compute_zones) | reject('in', fd_names) | list }},
          defined: {{ fd_names }}

    - name: Failure domains set on hosts are in their machine pool's zones
      assert:
        that:
          - hostvars[item].vsphere_failure_domain in (control_plane_zones if item in masters else compute_zones)
        fail_msg: >-
          {{ item }}'s vsphere_failure_domain {{ hostvars[item].vsphere_failure_domain }} is not one of its
          pool's zones: {{ control_plane_zones if item in masters else compute_zones }}
      loop: "{{ masters + workers }}"
      when: hostvars[item].vsphere_failure_domain is defined

    - name: The bootstrap failure domain exists
      assert:
        that:
          - vsphere.bootstrap_failure_domain in fd_names
        fail_msg: "bootstrap_failure_domain {{ vsphere.bootstrap_failure_domain }} is not one of {{ fd_names }}"
      when: vsphere.bootstrap_failure_domain is defined

    - name: Every node has an IP inside machine_network_cidr
      assert:
        that:
          - hostvars[item].ip is defined
          - hostvars[item].ip | ip_in_network(machine_network_cidr)
        fail_msg: >-
          {{ item }} needs an `ip` inside machine_network_cidr ({{ machine_network_cidr }})
          in {{ cluster_dir }}/inventory/hosts.yaml.
      loop: "{{ masters + workers }}"

    - name: The bootstrap IP and the VIPs are inside machine_network_cidr
      assert:
        that:
          - item | ip_in_network(machine_network_cidr)
        fail_msg: "{{ item }} is not inside machine_network_cidr ({{ machine_network_cidr }})."
      loop: "{{ [vsphere.bootstrap_ip] + api_vips + ingress_vips }}"

    - name: No two nodes, the bootstrap or a VIP share an address
      vars:
        all_ips: "{{ [vsphere.bootstrap_ip] + api_vips + ingress_vips + (masters + workers) | map('extract', hostvars, 'ip') | list }}"
      assert:
        that:
          - all_ips | length == all_ips | unique | length
        fail_msg: "Duplicate address among the bootstrap IP, the VIPs and the nodes' IPs: {{ all_ips }}"

    # One native Jinja expression, so replicas/hostPrefix/cpus/... stay integers
    - name: Assemble the install-config.yaml document
      vars:
        bootstrap_host:
          ip: "{{ vsphere.bootstrap_ip }}"
          vsphere_failure_domain: "{{ vsphere.bootstrap_failure_domain | default('') }}"
      set_fact:
        vsphere_install_config: >-
          {{
            {
              'additionalTrustBundlePolicy': 'Proxyonly',
              'apiVersion': 'v1',
              'baseDomain': base_domain,
            }
            | combine({
              'compute': [{
                'architecture': vsphere.architecture | default('amd64'),
                'hyperthreading': 'Enabled',
                'name': 'worker',
                'platform': compute_pool | vsphere_machine_pool,
                'replicas': workers | length,
              }],
              'controlPlane': {
                'architecture': vsphere.architecture | default('amd64'),
                'hyperthreading': 'Enabled',
                'name': 'master',
                'platform': control_plane_pool | vsphere_machine_pool,
                'replicas': masters | length,
              },
              'metadata': {'name': cluster_name},
              'networking': {
                'clusterNetwork': [{'cidr': cluster_network_cidr | default('10.128.0.0/14'),
                                    'hostPrefix': cluster_network_host_prefix | default(23) | int}],
                'machineNetwork': [{'cidr': machine_network_cidr}],
                'networkType': 'OVNKubernetes',
                'serviceNetwork': [service_network_cidr | default('172.30.0.0/16')],
              },
              'platform': {'vsphere': {
                'hosts': bootstrap_host | vsphere_static_hosts(masters, workers, hostvars,
                                                               gateway, dns.server, network_profile.prefix_length,
                                                               fd_names, control_plane_zones, compute_zones),
                'apiVIPs': api_vips,
                'failureDomains': failure_domains | map('vsphere_failure_domain') | list,
                'ingressVIPs': ingress_vips,
                'vcenters': vsphere.vcenters | vsphere_vcenters(failure_domains),
              }},
              'publish': vsphere.publish | default('External'),
              'pullSecret': pull_secret,
              'sshKey': ssh_key,
            })
            | combine({'imageDigestSources': image_digest_sources} if image_digest_sources is defined else {})
          }}

    - name: Ensure the output directory exists
      file:
        path: "{{ output_dir }}"
        state: directory
        mode: "0755"

    # mode 600: it holds the vCenter password and the pull secret
    - name: Write install-config.yaml
      copy:
        dest: "{{ output_dir }}/install-config.yaml"
        mode: "0600"
        content: "{{ vsphere_install_config | to_nice_yaml(indent=2, width=200, sort_keys=False) }}"

    - name: Done
      debug:
        msg: "Wrote {{ output_dir }}/install-config.yaml"
