    macAddress: 52:54:00:aa:bb:03
  config:
    interfaces:
    - name: enp1s0
      type: ethernet
      state: up
      mtu: 1500
      mac-address: 52:54:00:aa:bb:03
      ipv4:
        enabled: true
        dhcp: false
        address:
        - ip: 192.168.122.103
          prefix-length: 24
    dns-resolver:
