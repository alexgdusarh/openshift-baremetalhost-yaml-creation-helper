apiVersion: v1
baseDomain: example.com
metadata:
  name: ocp-lab
compute:
- name: worker
  replicas: 1
controlPlane:
  name: master
  replicas: 3
networking:
  clusterNetwork:
  - cidr: 10.128.0.0/14
    hostPrefix: 23
  networkType: OVNKubernetes
  serviceNetwork:
  - 172.30.0.0/16
  machineNetwork:
  - cidr: 10.10.10.0/24
platform:
  baremetal:
    apiVIPs:
    - 10.10.10.10
    ingressVIPs:
    - 10.10.10.9
    loadBalancer:
      type: OpenShiftManagedDefault
pullSecret: CHANGE_ME - paste your pull secret JSON here as a single-quoted string
sshKey: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAA... CHANGE_ME your-public-key
