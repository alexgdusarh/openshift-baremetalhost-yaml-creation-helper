additionalTrustBundlePolicy: Proxyonly
apiVersion: v1
baseDomain: example.com
compute:
- architecture: amd64
  hyperthreading: Enabled
  name: worker
  platform:
    vsphere:
      cpus: 16
      coresPerSocket: 8
      memoryMB: 65536
      osDisk:
        diskSizeGB: 120
  replicas: 1
controlPlane:
  architecture: amd64
  hyperthreading: Enabled
  name: master
  platform:
    vsphere:
      zones:
      - CHANGE_ME-fd-1
      - CHANGE_ME-fd-2
      - CHANGE_ME-fd-3
      cpus: 8
      coresPerSocket: 4
      memoryMB: 16384
      osDisk:
        diskSizeGB: 120
  replicas: 3
metadata:
  name: ocp-lab
networking:
  clusterNetwork:
  - cidr: 10.128.0.0/14
    hostPrefix: 23
  machineNetwork:
  - cidr: 10.10.10.0/24
  networkType: OVNKubernetes
  serviceNetwork:
  - 172.30.0.0/16
platform:
  vsphere:
    hosts:
    - role: bootstrap
      failureDomain: CHANGE_ME-fd-1
      networkDevice:
        ipAddrs:
        - 10.10.10.30/24
        gateway: 10.10.10.1
        nameservers:
        - 10.10.10.1
    - role: control-plane
      failureDomain: CHANGE_ME-fd-1
      networkDevice:
        ipAddrs:
        - 10.10.10.11/24
        gateway: 10.10.10.1
        nameservers:
        - 10.10.10.1
    - role: control-plane
      failureDomain: CHANGE_ME-fd-2
      networkDevice:
        ipAddrs:
        - 10.10.10.12/24
        gateway: 10.10.10.1
        nameservers:
        - 10.10.10.1
    - role: control-plane
      failureDomain: CHANGE_ME-fd-3
      networkDevice:
        ipAddrs:
        - 10.10.10.13/24
        gateway: 10.10.10.1
        nameservers:
        - 10.10.10.1
    - role: compute
      failureDomain: CHANGE_ME-fd-1
      networkDevice:
        ipAddrs:
        - 10.10.10.14/24
        gateway: 10.10.10.1
        nameservers:
        - 10.10.10.1
    apiVIPs:
    - 10.10.10.10
    failureDomains:
    - name: CHANGE_ME-fd-1
      region: CHANGE_ME-region
      server: vcenter-1.example.com
      topology:
        computeCluster: /CHANGE_ME-Datacenter-1/host/CHANGE_ME-Cluster-1
        datacenter: CHANGE_ME-Datacenter-1
        datastore: /CHANGE_ME-Datacenter-1/datastore/CHANGE_ME-datastore-1
        networks:
        - CHANGE_ME-VM-Network
      zone: CHANGE_ME-zone-1
    - name: CHANGE_ME-fd-2
      region: CHANGE_ME-region
      server: vcenter-1.example.com
      topology:
        computeCluster: /CHANGE_ME-Datacenter-1/host/CHANGE_ME-Cluster-2
        datacenter: CHANGE_ME-Datacenter-1
        datastore: /CHANGE_ME-Datacenter-1/datastore/CHANGE_ME-datastore-2
        networks:
        - CHANGE_ME-VM-Network
      zone: CHANGE_ME-zone-2
    - name: CHANGE_ME-fd-3
      region: CHANGE_ME-region
      server: vcenter-2.example.com
      topology:
        computeCluster: /CHANGE_ME-Datacenter-2/host/CHANGE_ME-Cluster-3
        datacenter: CHANGE_ME-Datacenter-2
        datastore: /CHANGE_ME-Datacenter-2/datastore/CHANGE_ME-datastore-3
        networks:
        - CHANGE_ME-VM-Network
      zone: CHANGE_ME-zone-3
    ingressVIPs:
    - 10.10.10.9
    vcenters:
    - datacenters:
      - CHANGE_ME-Datacenter-1
      password: CHANGE_ME
      port: 443
      server: vcenter-1.example.com
      user: CHANGE_ME@vsphere.local
    - datacenters:
      - CHANGE_ME-Datacenter-2
      password: CHANGE_ME
      port: 443
      server: vcenter-2.example.com
      user: CHANGE_ME@vsphere.local
publish: External
pullSecret: CHANGE_ME - paste your pull secret JSON here as a single-quoted string
sshKey: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAA... CHANGE_ME your-public-key
