server01-bmc:
  bmc_address: 10.10.10.11
  model: PowerEdge R750
  vendor: Dell Inc.
  network_adapters:
    - adapter_id: NIC.Integrated.1
      model: Broadcom 5720 QP 1Gb
      manufacturer: Broadcom
      # devlink_port_naming defaults to false (see playbook.yaml / README's
      # interface-naming section) - a legacy 1GbE Broadcom LOM like this
      # one is typically tg3-driven, with no devlink phys_port_name, so
      # the predicted names below correctly have no 'npX' suffix. Set
      # devlink_port_naming: true in inventory/hosts.yaml for THIS host
      # only if you've confirmed via a live boot (altnames in `ip addr`)
      # that its actual driver is bnxt_en/mlx5_core and does expose one.
      part_number: 0XXXXX
      serial_number: null
      onboard: true
      pci_slot: null
      pci_slot_service_label: NIC.Integrated.1-1
      num_ports: 4
      ports:
        - port_number: 1
          mac_address: "AA:BB:CC:00:11:01"
          link_status: LinkUp
          predicted_linux_ifname: eno1
        - port_number: 2
          mac_address: "AA:BB:CC:00:11:02"
          link_status: LinkDown
          predicted_linux_ifname: eno2
        - port_number: 3
          mac_address: "AA:BB:CC:00:11:03"
          link_status: LinkDown
          predicted_linux_ifname: eno3
        - port_number: 4
          mac_address: "AA:BB:CC:00:11:04"
          link_status: LinkDown
          predicted_linux_ifname: eno4
    - adapter_id: NIC.Slot.2
      model: Mellanox ConnectX-6 Dx Dual Port 25GbE
      manufacturer: Mellanox
      part_number: 0YYYYY
      serial_number: null
      onboard: false
      pci_slot: 2
      pci_slot_service_label: NIC.Slot.2-1
      num_ports: 2
      ports:
        - port_number: 1
          mac_address: "AA:BB:CC:00:22:01"
          link_status: LinkUp
          predicted_linux_ifname: ens2
        - port_number: 2
          mac_address: "AA:BB:CC:00:22:02"
          link_status: LinkUp
          predicted_linux_ifname: ens2f1
  storage:
    controllers:
      - controller_id: RAID.Integrated.1-1
        model: PERC H755
        scsi_host_index: 0
        pci_bus: 24
        pci_device: 0
        pci_function: 0
        pci_bdf_source: oem
    physical_drives: []
    virtual_disks:
      - volume_id: "Disk.Virtual.0:RAID.Integrated.1-1"
        name: VD0
        raid_type: RAID1
        capacity_bytes: 480000000000
        controller_id: RAID.Integrated.1-1
        member_physical_drives:
          - "Disk.Bay.0:Enclosure.Internal.0-1:RAID.Integrated.1-1"
          - "Disk.Bay.1:Enclosure.Internal.0-1:RAID.Integrated.1-1"
        scsi_target: 0
        predicted_by_path: "/dev/disk/by-path/pci-0000:18:00.0-scsi-0:0:0:0"
        by_path_confidence: high
        # This PERC controller happens to populate a durable WWN for the
        # virtual disk - select_boot_disk() prefers this over
        # predicted_by_path when present (see its docstring for why).
        # server02-04 below deliberately leave this null to show the
        # by-path fallback still working - WWN availability varies by
        # controller/vendor, it's not guaranteed.
        wwn: "0x6b083fe0b1b9518029a5c8b30a5e1234"
        wwn_format: NAA
        bootable: true

