apiVersion: v1beta1
kind: AgentConfig
metadata:
  name: ocp-lab
rendezvousIP: 10.10.10.11
additionalNTPSources:
- 10.10.10.1
- pool.ntp.org
hosts:
- hostname: server01-bmc
  rootDeviceHints:
    deviceName: /dev/disk/by-path/pci-0000:18:00.0-scsi-0:0:0:0
  role: master
  interfaces:
  - name: eno1
    macAddress: AA:BB:CC:00:11:01
  - name: eno2
    macAddress: AA:BB:CC:00:11:02
  - name: eno3
    macAddress: AA:BB:CC:00:11:03
  - name: eno4
    macAddress: AA:BB:CC:00:11:04
  - name: ens2
    macAddress: AA:BB:CC:00:22:01
  - name: ens2f1
    macAddress: AA:BB:CC:00:22:02
  networkConfig:
    interfaces:
    - name: ens2
      type: ethernet
      state: up
      mtu: 9000
      mac-address: AA:BB:CC:00:22:01
      permanent-mac-address: AA:BB:CC:00:22:01
    - name: ens2f1
      type: ethernet
      state: up
      mtu: 9000
      mac-address: AA:BB:CC:00:22:01
      permanent-mac-address: AA:BB:CC:00:22:02
    - name: bond0
      type: bond
      state: up
      mtu: 9000
      mac-address: AA:BB:CC:00:22:01
      link-aggregation:
        mode: 802.3ad
        port:
        - ens2
        - ens2f1
        options:
          lacp_rate: fast
          lp_interval: 1
          miimon: 100
          xmit_hash_policy: layer3+4
          lacp_active: true
      ipv4:
        enabled: true
        dhcp: false
        address:
        - ip: 10.10.10.11
          prefix-length: 24
    - name: eno1
      type: ethernet
      state: down
    - name: eno2
      type: ethernet
      state: down
    - name: eno3
      type: ethernet
      state: down
    - name: eno4
      type: ethernet
      state: down
    dns-resolver:
      config:
        server:
        - 10.10.10.1
        search:
        - example.com
    routes:
      config:
      - destination: 0.0.0.0/0
        next-hop-address: 10.10.10.1
        next-hop-interface: bond0
        table-id: 254
