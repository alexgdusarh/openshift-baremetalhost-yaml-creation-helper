---
apiVersion: agent-install.openshift.io/v1beta1
kind: NMStateConfig
metadata:
  name: master-02.openshift.training-network-config
  namespace: openshift
  labels:
    agent-install.openshift.io/bmh: master-02.openshift.training
    infraenvs.agent-install.openshift.io: openshift
spec:
  interfaces:
  - name: eno1
    macAddress: 6C:3C:8C:65:06:C9
  - name: eno2
    macAddress: 6C:3C:8C:65:06:CA
  config:
    interfaces:
    - name: eno1
      type: ethernet
      state: up
      mtu: 1500
      mac-address: 6C:3C:8C:65:06:C9
      permanent-mac-address: 6C:3C:8C:65:06:C9
    - name: eno2
      type: ethernet
      state: up
      mtu: 1500
      mac-address: 6C:3C:8C:65:06:C9
      permanent-mac-address: 6C:3C:8C:65:06:CA
    - name: bond0
      type: bond
      state: up
      mtu: 1500
      mac-address: 6C:3C:8C:65:06:C9
      link-aggregation:
        mode: 802.3ad
        port:
        - eno1
        - eno2
        options:
          lacp_rate: fast
          lp_interval: 1
          miimon: 100
          xmit_hash_policy: layer3+4
          lacp_active: true
      ipv4:
        enabled: false
    - name: bond0.200
      type: vlan
      state: up
      mac-address: 6C:3C:8C:65:06:C9
      vlan:
        base-iface: bond0
        id: 200
      ipv4:
        enabled: true
        dhcp: false
        address:
        - ip: 192.168.0.24
          prefix-length: 24
    dns-resolver:
      config:
        server:
        - 192.168.0.254
        search:
        - openshift.training
    routes:
      config:
      - destination: 0.0.0.0/0
        next-hop-address: 192.168.0.254
        next-hop-interface: bond0.200
        table-id: 254
---
apiVersion: v1
kind: Secret
metadata:
  name: master-02.openshift.training-bmc-secret
  namespace: openshift
type: Opaque
data:
  username: Q0hBTkdFX01F
  password: Q0hBTkdFX01F
---
apiVersion: metal3.io/v1alpha1
kind: BareMetalHost
metadata:
  name: master-02.openshift.training
  namespace: openshift
  annotations:
    bmac.agent-install.openshift.io/hostname: master-02.openshift.training
    bmac.agent-install.openshift.io/cluster-reference: openshift/openshift
    bmac.agent-install.openshift.io/role: master
    agent.agent-install.openshift.io/role: master
    inspect.metal3.io: disabled
    bmac.agent-install.openshift.io.node-label.topology.kubernetes.io/region: basement
    bmac.agent-install.openshift.io.node-label.topology.kubernetes.io/zone: rack-3
  labels:
    cluster.open-cluster-management.io/backup: 'true'
    infraenvs.agent-install.openshift.io: openshift
spec:
  automatedCleaningMode: disabled
  bmc:
    address: idrac-virtualmedia://192.168.1.12/redfish/v1/Systems/System.Embedded.1
    credentialsName: master-02.openshift.training-bmc-secret
    disableCertificateVerification: true
  bootMACAddress: 6C:3C:8C:65:06:C9
  customDeploy:
    method: start_assisted_install
  online: true
