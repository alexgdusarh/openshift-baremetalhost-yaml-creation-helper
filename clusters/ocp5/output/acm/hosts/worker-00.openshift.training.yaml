---
apiVersion: agent-install.openshift.io/v1beta1
kind: NMStateConfig
metadata:
  name: worker-00.openshift.training-network-config
  namespace: openshift
  labels:
    agent-install.openshift.io/bmh: worker-00.openshift.training
    infraenvs.agent-install.openshift.io: openshift
spec:
  interfaces:
  - name: eno4
    macAddress: 78:AC:44:28:98:43
  - name: eno3
    macAddress: 78:AC:44:28:98:42
  config:
    interfaces:
    - name: eno4
      type: ethernet
      state: up
      mtu: 1500
      mac-address: 78:AC:44:28:98:43
      permanent-mac-address: 78:AC:44:28:98:43
    - name: eno3
      type: ethernet
      state: up
      mtu: 1500
      mac-address: 78:AC:44:28:98:43
      permanent-mac-address: 78:AC:44:28:98:42
    - name: bond0
      type: bond
      state: up
      mtu: 1500
      mac-address: 78:AC:44:28:98:43
      link-aggregation:
        mode: 802.3ad
        port:
        - eno4
        - eno3
        options:
          lacp_rate: fast
          lp_interval: 1
          miimon: 100
          xmit_hash_policy: layer3+4
          lacp_active: true
      ipv4:
        enabled: false
    - name: bond0.200
      type: vlan
      state: up
      mac-address: 78:AC:44:28:98:43
      vlan:
        base-iface: bond0
        id: 200
      ipv4:
        enabled: true
        dhcp: false
        address:
        - ip: 192.168.0.25
          prefix-length: 24
    - name: eno1
      type: ethernet
      state: down
    - name: eno2
      type: ethernet
      state: down
    dns-resolver:
      config:
        server:
        - 192.168.0.254
        search:
        - openshift.training
    routes:
      config:
      - destination: 0.0.0.0/0
        next-hop-address: 192.168.0.254
        next-hop-interface: bond0.200
        table-id: 254
---
apiVersion: v1
kind: Secret
metadata:
  name: worker-00.openshift.training-bmc-secret
  namespace: openshift
type: Opaque
data:
  username: Q0hBTkdFX01F
  password: Q0hBTkdFX01F
---
apiVersion: metal3.io/v1alpha1
kind: BareMetalHost
metadata:
  name: worker-00.openshift.training
  namespace: openshift
  annotations:
    bmac.agent-install.openshift.io/hostname: worker-00.openshift.training
    bmac.agent-install.openshift.io/cluster-reference: openshift/openshift
    bmac.agent-install.openshift.io/role: worker
    agent.agent-install.openshift.io/role: worker
    inspect.metal3.io: disabled
    bmac.agent-install.openshift.io.node-label.topology.kubernetes.io/region: basement
    bmac.agent-install.openshift.io.node-label.topology.kubernetes.io/zone: rack-1
  labels:
    cluster.open-cluster-management.io/backup: 'true'
    infraenvs.agent-install.openshift.io: openshift
spec:
  automatedCleaningMode: disabled
  bmc:
    address: idrac-virtualmedia://192.168.1.13/redfish/v1/Systems/System.Embedded.1
    credentialsName: worker-00.openshift.training-bmc-secret
    disableCertificateVerification: true
  bootMACAddress: 78:AC:44:28:98:43
  customDeploy:
    method: start_assisted_install
  online: true
