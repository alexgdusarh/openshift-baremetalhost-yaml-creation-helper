---
apiVersion: agent-install.openshift.io/v1beta1
kind: InfraEnv
metadata:
  name: openshift
  namespace: openshift
  labels:
    agentclusterinstalls.extensions.hive.openshift.io/location: basement
spec:
  agentLabels:
    agentclusterinstalls.extensions.hive.openshift.io/location: basement
  pullSecretRef:
    name: pullsecret-openshift
  sshAuthorizedKey: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAA... CHANGE_ME your-public-key
  nmStateConfigLabelSelector:
    matchLabels:
      infraenvs.agent-install.openshift.io: openshift
  cpuArchitecture: x86_64
status:
  agentLabelSelector:
    matchLabels:
      agentclusterinstalls.extensions.hive.openshift.io/location: basement
---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: capi-provider-role
  namespace: openshift
rules:
- verbs:
  - '*'
  apiGroups:
  - agent-install.openshift.io
  resources:
  - agents
---
apiVersion: hive.openshift.io/v1
kind: ClusterDeployment
metadata:
  name: openshift
  namespace: openshift
  labels:
    cluster.open-cluster-management.io/clusterset: default
    hive.openshift.io/cluster-platform: agent-baremetal
spec:
  platform:
    agentBareMetal:
      agentSelector: {}
  clusterName: openshift
  baseDomain: training
  pullSecretRef:
    name: pullsecret-cluster-openshift
  clusterInstallRef:
    kind: AgentClusterInstall
    name: openshift
    group: extensions.hive.openshift.io
    version: v1beta1
  controlPlaneConfig:
    servingCertificates: {}
  installed: false
---
apiVersion: extensions.hive.openshift.io/v1beta1
kind: AgentClusterInstall
metadata:
  name: openshift
  namespace: openshift
spec:
  clusterDeploymentRef:
    name: openshift
  holdInstallation: false
  imageSetRef:
    name: img4.20.13-multi-appsub
  networking:
    networkType: OVNKubernetes
    clusterNetwork:
    - cidr: 10.128.0.0/14
      hostPrefix: '23'
    serviceNetwork:
    - 172.30.0.0/16
    userManagedNetworking: false
    machineNetwork:
    - cidr: 192.168.0.0/24
  platformType: BareMetal
  provisionRequirements:
    controlPlaneAgents: '3'
    workerAgents: '3'
    arbiterAgents: 0
  sshPublicKey: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAA... CHANGE_ME your-public-key
  apiVIP: 192.168.0.20
  apiVIPs:
  - 192.168.0.20
  ingressVIP: 192.168.0.21
  ingressVIPs:
  - 192.168.0.21
  manifestsConfigMapRefs: []
---
apiVersion: cluster.open-cluster-management.io/v1
kind: ManagedCluster
metadata:
  name: openshift
  labels:
    cloud: BareMetal
    cluster.open-cluster-management.io/clusterset: default
    feature.open-cluster-management.io/addon-application-manager: unreachable
    feature.open-cluster-management.io/addon-cert-policy-controller: unreachable
    feature.open-cluster-management.io/addon-cluster-proxy: unreachable
    feature.open-cluster-management.io/addon-config-policy-controller: unreachable
    feature.open-cluster-management.io/addon-governance-policy-framework: unreachable
    feature.open-cluster-management.io/addon-managed-serviceaccount: unreachable
    feature.open-cluster-management.io/addon-search-collector: unreachable
    feature.open-cluster-management.io/addon-work-manager: unreachable
    name: openshift
    vendor: OpenShift
    dc: basement
spec:
  hubAcceptsClient: true
  leaseDurationSeconds: 60
  taints:
  - effect: NoSelect
    key: cluster.open-cluster-management.io/unreachable
    timeAdded: '2026-09-20T04:56:21Z'
---
apiVersion: agent.open-cluster-management.io/v1
kind: KlusterletAddonConfig
metadata:
  name: openshift
  namespace: openshift
spec:
  applicationManager:
    enabled: true
  certPolicyController:
    enabled: true
  clusterLabels:
    cloud: BareMetal
    vendor: OpenShift
  clusterName: openshift
  clusterNamespace: openshift
  policyController:
    enabled: true
  searchCollector:
    enabled: true
