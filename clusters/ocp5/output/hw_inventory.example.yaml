      manufacturer: Mellanox
      part_number: 0YYYYY
      serial_number: null
      onboard: false
      pci_slot: 2
      pci_slot_service_label: NIC.Slot.2-1
      num_ports: 2
      ports:
        - port_number: 1
          mac_address: "AA:BB:CC:00:22:01"
          link_status: LinkUp
          predicted_linux_ifname: ens2
        - port_number: 2
          mac_address: "AA:BB:CC:00:22:02"
          link_status: LinkUp
          predicted_linux_ifname: ens2f1
  storage:
    controllers:
      - controller_id: RAID.Integrated.1-1
        model: PERC H755
        scsi_host_index: 0
