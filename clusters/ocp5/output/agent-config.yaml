apiVersion: v1beta1
kind: AgentConfig
metadata:
  name: openshift
rendezvousIP: 192.168.0.22
additionalNTPSources:
- pool.ntp.org
hosts:
- hostname: master-00
  rootDeviceHints:
    wwn: '0x50014ee0adfe2945'
  role: master
  interfaces:
  - name: eno1
    macAddress: 6C:3C:8C:65:52:19
  - name: eno2
    macAddress: 6C:3C:8C:65:52:1A
  networkConfig:
    interfaces:
    - name: eno1
      type: ethernet
      state: up
      mtu: 1500
      mac-address: 6C:3C:8C:65:52:19
      permanent-mac-address: 6C:3C:8C:65:52:19
    - name: eno2
      type: ethernet
      state: up
      mtu: 1500
      mac-address: 6C:3C:8C:65:52:19
      permanent-mac-address: 6C:3C:8C:65:52:1A
    - name: bond0
      type: bond
      state: up
      mtu: 1500
      mac-address: 6C:3C:8C:65:52:19
      link-aggregation:
        mode: 802.3ad
        port:
        - eno1
        - eno2
        options:
          lacp_rate: fast
          lp_interval: 1
          miimon: 100
          xmit_hash_policy: layer3+4
          lacp_active: true
      ipv4:
        enabled: false
    - name: bond0.200
      type: vlan
      state: up
      mac-address: 6C:3C:8C:65:52:19
      vlan:
        base-iface: bond0
        id: 200
      ipv4:
        enabled: true
        dhcp: false
        address:
        - ip: 192.168.0.22
          prefix-length: 24
    dns-resolver:
      config:
        server:
        - 192.168.0.254
        search:
        - openshift.training
    routes:
      config:
      - destination: 0.0.0.0/0
        next-hop-address: 192.168.0.254
        next-hop-interface: bond0.200
        table-id: 254
