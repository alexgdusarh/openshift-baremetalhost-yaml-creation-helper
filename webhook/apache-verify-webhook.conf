# apache-verify-webhook.conf  [OPTIONAL]
#
# The webhook (verify_webhook.py) is a complete, standalone service on
# its own - it does not need Apache in front of it, and the default
# setup doesn't use this file at all (see README's "Verifying
# predictions..." section for the direct-exposure setup). This is only
# useful if you specifically want TLS termination or access control
# (IP allowlist, basic auth) in front of it, reusing a vhost/cert this
# box's Apache already has - not required for correct operation.
#
# Drop into /etc/httpd/conf.d/ (RHEL/CentOS) or /etc/apache2/conf-available/
# + a2enconf (Debian/Ubuntu). Requires mod_proxy and mod_proxy_http
# (usually already enabled if this box serves anything else via a
# reverse proxy; `a2enmod proxy proxy_http` on Debian/Ubuntu, or confirm
# the two LoadModule lines are present/uncommented in
# /etc/httpd/conf.modules.d/00-proxy.conf on RHEL/CentOS).
#
# If you use this, also change verify-webhook.service to bind the
# Python process to 127.0.0.1 only (edit its ExecStart to pass that as
# an extra arg, or add a BIND_HOST env var - not built in below since
# the direct-exposure default doesn't need it), so the webhook is only
# reachable through Apache, not directly on its bare port too.

ProxyPreserveHost On

<Location /verify-webhook/>
    ProxyPass        http://127.0.0.1:8090/
    ProxyPassReverse http://127.0.0.1:8090/
</Location>

# collect-facts.sh POSTs to <WEBHOOK_URL>/verify - so set:
#   WEBHOOK_URL=http://<this-host>/verify-webhook
# when building verify.iso (manage-verify-iso.yaml's -e webhook_url=...),
# NOT the bare :8090 address, so it goes through this proxy.
